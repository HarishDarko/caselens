spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: caselens
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    hikari:
      # Neon serverless tuning: hold zero idle connections so Neon can scale
      # to zero between demo visits. Every new physical connection resets
      # Neon's 5-minute idle timer, so a full idle pool keeps compute awake.
      minimum-idle: 0
      maximum-pool-size: 4
      idle-timeout: 60000
      max-lifetime: 600000
      keepalive-time: 0
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

caselens:
  ai-provider: ${CASELENS_AI_PROVIDER:mock}
  runtime:
    environment: ${CASELENS_RUNTIME_ENVIRONMENT:local-review}
    database: ${CASELENS_RUNTIME_DATABASE:postgresql}
    queue: ${CASELENS_RUNTIME_QUEUE:localstack-sqs}
  demo:
    failure-scenarios-enabled: ${CASELENS_DEMO_FAILURE_SCENARIOS_ENABLED:false}
  session-secret: ${CASELENS_SESSION_SECRET}
  web:
    origins: ${CASELENS_WEB_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
  triage-queue-url: ${CASELENS_TRIAGE_QUEUE_URL}
  queue:
    enabled: ${CASELENS_QUEUE_ENABLED:false}
  rate-limit:
    default-per-minute: ${CASELENS_RATE_LIMIT_DEFAULT_PER_MINUTE:30}
    session-per-minute: ${CASELENS_RATE_LIMIT_SESSION_PER_MINUTE:20}
    triage-per-minute: ${CASELENS_RATE_LIMIT_TRIAGE_PER_MINUTE:30}
    mutation-per-minute: ${CASELENS_RATE_LIMIT_MUTATION_PER_MINUTE:${CASELENS_RATE_LIMIT_DEFAULT_PER_MINUTE:30}}
    ticket-per-minute: ${CASELENS_RATE_LIMIT_TICKET_PER_MINUTE:10}
    feedback-per-minute: ${CASELENS_RATE_LIMIT_FEEDBACK_PER_MINUTE:20}
  limits:
    # A seeded workspace holds about 10 tickets; 50 leaves room to explore and bounds the overview queries.
    tickets-per-workspace: ${CASELENS_LIMIT_TICKETS_PER_WORKSPACE:50}
    feedback-per-workspace: ${CASELENS_LIMIT_FEEDBACK_PER_WORKSPACE:100}
  ai:
    # Sized for Groq's free plan (docs checked 2026-11-24): openai/gpt-oss-20b allows 30 requests/min, 1,000 requests/day,
    # 8,000 tokens/min and 200,000 tokens/day. A measured triage used about 1,700 tokens (1,164 in, 517 out), about 2,000
    # on average, so the token cap fits roughly 100 triages a day; 80 keeps headroom, and 20 per client stops one visitor
    # taking a quarter of it.
    # AI provider calls per UTC day across all instances; past it, triage uses the rules provider. 0 turns AI off.
    daily-call-budget: ${CASELENS_AI_DAILY_CALL_BUDGET:80}
    # The most of that budget one client network (an IPv4 address or an IPv6 /64) can spend per UTC day; past it, that
    # client's triage uses the rules provider and everyone else still gets AI. 0 turns the share off.
    daily-call-share-per-client: ${CASELENS_AI_DAILY_CALL_SHARE_PER_CLIENT:20}
  cleanup:
    initial-delay-ms: ${CASELENS_CLEANUP_INITIAL_DELAY_MS:21600000}
    fixed-delay-ms: ${CASELENS_CLEANUP_FIXED_DELAY_MS:21600000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1/interactions}
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:30s}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    endpoint: ${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
    request-timeout: ${GROQ_REQUEST_TIMEOUT:20s}

aws:
  region: ${AWS_REGION:ca-central-1}
  endpoint: ${AWS_ENDPOINT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
