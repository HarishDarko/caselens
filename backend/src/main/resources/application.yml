spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: caselens
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

caselens:
  ai-provider: ${CASELENS_AI_PROVIDER:mock}
  demo-passcode: ${CASELENS_DEMO_PASSCODE}
  session-secret: ${CASELENS_SESSION_SECRET}
  triage-queue-url: ${CASELENS_TRIAGE_QUEUE_URL}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1/interactions}

aws:
  region: ${AWS_REGION:ca-central-1}
  endpoint: ${AWS_ENDPOINT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
