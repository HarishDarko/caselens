spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: caselens
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

caselens:
  ai-provider: ${CASELENS_AI_PROVIDER:mock}
  runtime:
    environment: ${CASELENS_RUNTIME_ENVIRONMENT:local-review}
    database: ${CASELENS_RUNTIME_DATABASE:postgresql}
    queue: ${CASELENS_RUNTIME_QUEUE:localstack-sqs}
    ai-provider: ${CASELENS_RUNTIME_AI_PROVIDER:deterministic}
  demo-passcode: ${CASELENS_DEMO_PASSCODE}
  demo:
    failure-scenarios-enabled: ${CASELENS_DEMO_FAILURE_SCENARIOS_ENABLED:false}
  session-secret: ${CASELENS_SESSION_SECRET}
  web:
    origins: ${CASELENS_WEB_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
  triage-queue-url: ${CASELENS_TRIAGE_QUEUE_URL}
  queue:
    enabled: ${CASELENS_QUEUE_ENABLED:false}
  rate-limit:
    default-per-minute: ${CASELENS_RATE_LIMIT_DEFAULT_PER_MINUTE:30}
    session-per-minute: ${CASELENS_RATE_LIMIT_SESSION_PER_MINUTE:20}
    triage-per-minute: ${CASELENS_RATE_LIMIT_TRIAGE_PER_MINUTE:30}
    mutation-per-minute: ${CASELENS_RATE_LIMIT_MUTATION_PER_MINUTE:${CASELENS_RATE_LIMIT_DEFAULT_PER_MINUTE:30}}
  cleanup:
    initial-delay-ms: ${CASELENS_CLEANUP_INITIAL_DELAY_MS:3600000}
    fixed-delay-ms: ${CASELENS_CLEANUP_FIXED_DELAY_MS:3600000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1/interactions}
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:30s}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    endpoint: ${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
    request-timeout: ${GROQ_REQUEST_TIMEOUT:20s}

aws:
  region: ${AWS_REGION:ca-central-1}
  endpoint: ${AWS_ENDPOINT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
