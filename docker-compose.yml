services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: caselens
      POSTGRES_USER: caselens
      POSTGRES_PASSWORD: caselens
    ports:
      - "5432:5432"
    volumes:
      - caselens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselens -d caselens"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ca-central-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caselens-postgres:
