name: CaseLens Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY_CASELENS to confirm application teardown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: caselens-production-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TERRAFORM_STATE_BUCKET: ${{ vars.CASELENS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_force_destroy_storage: true
      DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
      DESTROY_ROLE_ARN: ${{ secrets.AWS_DESTROY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require explicit destroy confirmation and configuration
        run: |
          test "$DESTROY_CONFIRMATION" = "DESTROY_CASELENS"
          test -n "$AWS_REGION"
          test -n "$TERRAFORM_STATE_BUCKET"
          test -n "$DESTROY_ROLE_ARN"
          test "$GITHUB_REF" = "refs/heads/feat/production-proof"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DESTROY_ROLE_ARN }}

      - name: Initialize remote Terraform state
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Create and inspect destroy plan
        working-directory: infra/terraform
        run: |
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
          delete_count="$(terraform show -json destroy.tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')"
          test "$delete_count" -gt 0

      - name: Apply the reviewed destroy plan
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve destroy.tfplan
