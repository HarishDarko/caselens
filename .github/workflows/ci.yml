name: CaseLens CI

on:
  pull_request:
  push:
    branches: [feat/production-proof, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caselens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B -ntp test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser journey
        working-directory: frontend
        run: npx playwright test --project=chromium

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag caselens-backend:${{ github.sha }} -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build --tag caselens-frontend:${{ github.sha }} -f frontend/Dockerfile .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: caselens-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, terraform, security, container]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.CASELENS_API_BASE_URL }}
        run: npm ci && npm run build
      - name: Require the deployed API base URL
        env:
          CASELENS_API_BASE_URL: ${{ vars.CASELENS_API_BASE_URL }}
        run: test -n "$CASELENS_API_BASE_URL"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Publish frontend to the deployment bucket
        run: aws s3 sync frontend/dist "s3://${{ vars.CASELENS_FRONTEND_BUCKET }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CASELENS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
